apiVersion: 1

datasources:
  # ══════════════════════════════════════════════════════════════════
  #
  # ══════════════════════════════════════════════════════════════════
  - name: ClickHouse
    uid: clickhouse-tourism
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      secure: false
      username: default
      defaultDatabase: tourism
      tlsSkipVerify: true
      dialTimeout: 10
      queryTimeout: 120
    secureJsonData:
      password: $CH_PASSWORD

  # ══════════════════════════════════════════════════════════════════
  # ══════════════════════════════════════════════════════════════════
  - name: Prometheus
    uid: prometheus-infra
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: false
    editable: true
    jsonData:
      timeInterval: 15s
