networks:
  data-net:
    driver: bridge

volumes:
  clickhouse-data:
  kafka-data:
  prometheus-data:
  grafana-data:

configs:
  clickhouse-prometheus-xml:
    content: |
      <clickhouse>
          <prometheus>
              <endpoint>/metrics</endpoint>
              <port>9363</port>
              <metrics>true</metrics>
              <events>true</events>
              <asynchronous_metrics>true</asynchronous_metrics>
          </prometheus>
      </clickhouse>

  # system.metric_log has about 2,100 columns, and each of its background
  # merges peaks at about 730 MiB, which with the 1g limit makes parallel
  # inserts fail at random (docs/result/br6/result-pipeline.md). Nothing here
  # reads it: Grafana scrapes the Prometheus endpoint above, run figures read
  # system.query_log.
  clickhouse-system-logs-xml:
    content: |
      <clickhouse>
          <metric_log remove="1"/>
      </clickhouse>

  # ClickHouse server-level settings (need a ClickHouse restart). To use:
  # uncomment this config and its entry under the clickhouse service's
  # `configs:`, then follow docs/guide/br5/config-guide.md.
  # clickhouse-server-xml:
  #   content: |
  #     <clickhouse>
  #         <max_server_memory_usage_to_ram_ratio>0.9</max_server_memory_usage_to_ram_ratio>
  #         <background_pool_size>4</background_pool_size>
  #     </clickhouse>

  clickhouse-mysql-xml:
    content: |
      <clickhouse>
          <mysql_port>9004</mysql_port>
      </clickhouse>

  spark-metrics-properties:
    content: |
      *.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
      *.sink.prometheusServlet.path=/metrics/prometheus
      master.sink.prometheusServlet.path=/metrics/master/prometheus

  prometheus-yml:
    content: |
      global:
        scrape_interval: 15s
        evaluation_interval: 15s

      scrape_configs:
        - job_name: prometheus
          static_configs:
            - targets: ["localhost:9090"]

        - job_name: clickhouse
          static_configs:
            - targets: ["clickhouse:9363"]

        - job_name: spark-master
          metrics_path: /metrics/master/prometheus/
          static_configs:
            - targets: ["spark-master:8080"]

        - job_name: spark-worker
          metrics_path: /metrics/prometheus/
          static_configs:
            - targets: ["spark-worker:8081"]

        # BR5: CPU and memory per container (docker/docker-stats). Shorter
        # interval, since a BR5 run lasts about 30 s.
        - job_name: docker-stats
          scrape_interval: 5s
          static_configs:
            - targets: ["docker-stats:9417"]

        - job_name: spark-driver
          metrics_path: /metrics/prometheus/
          static_configs:
            - targets: ["spark-local:4040", "spark-local:4041", "spark-local:4042", "spark-local:4043"]

        - job_name: spark-executors
          metrics_path: /metrics/executors/prometheus/
          static_configs:
            - targets: ["spark-local:4040", "spark-local:4041", "spark-local:4042", "spark-local:4043"]

  grafana-datasource-yml:
    content: |
      apiVersion: 1
      datasources:
        - name: Prometheus
          uid: prometheus
          type: prometheus
          access: proxy
          url: http://prometheus:9090
          isDefault: true
          editable: true
        - name: ClickHouse
          uid: clickhouse
          type: grafana-clickhouse-datasource
          access: proxy
          jsonData:
            host: clickhouse
            port: 8123
            protocol: http
            defaultDatabase: default
            username: default
          secureJsonData:
            password: clickhouse
          editable: true

  grafana-dashboard-provider-yml:
    content: |
      apiVersion: 1
      providers:
        - name: CO5173
          orgId: 1
          folder: CO5173
          type: file
          disableDeletion: false
          allowUiUpdates: true
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards
        # BR5 dashboards, in their own folder and directory (the provider above
        # reads its directory recursively).
        - name: BR5
          orgId: 1
          folder: BR5
          type: file
          disableDeletion: false
          allowUiUpdates: true
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards-br5
        # BR6 dashboards (docs/plan/br6/plan-monitoring.md, H3).
        - name: BR6
          orgId: 1
          folder: BR6
          type: file
          disableDeletion: false
          allowUiUpdates: true
          updateIntervalSeconds: 30
          options:
            path: /var/lib/grafana/dashboards-br6

services:
  # ------------------------------------------------------------------
  # ClickHouse
  # ------------------------------------------------------------------
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    container_name: clickhouse
    mem_limit: 1g
    # BR5_CLICKHOUSE_CPUS: the BR5 benchmark's ClickHouse sizes (docs/plan/br5/plan-benchmark.md); default 1.
    cpus: ${BR5_CLICKHOUSE_CPUS:-1}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "8123:8123" # HTTP interface
      - "9000:9000" # native TCP interface
      - "9363:9363" # Prometheus metrics endpoint
      - "9004:9004" # MySQL protocol (Looker Studio via tunnel)
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-clickhouse}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1" # lets default create the read-only looker user
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    configs:
      - source: clickhouse-prometheus-xml
        target: /etc/clickhouse-server/config.d/prometheus.xml
      - source: clickhouse-system-logs-xml
        target: /etc/clickhouse-server/config.d/system-logs.xml
      # - source: clickhouse-server-xml
      #   target: /etc/clickhouse-server/config.d/server-tuning.xml
      - source: clickhouse-mysql-xml
        target: /etc/clickhouse-server/config.d/mysql.xml
    networks:
      - data-net
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Public TCP tunnel for the BR2 Looker Studio connection (on demand).
  tunnel:
    image: ekzhang/bore:latest
    container_name: tunnel
    profiles: ["tunnel"]
    init: true
    command: ["local", "9004", "--local-host", "clickhouse", "--to", "bore.pub"]
    depends_on:
      - clickhouse
    networks:
      - data-net

  # ------------------------------------------------------------------
  # Kafka (KRaft mode, no Zookeeper needed)
  # ------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:8.3.1
    container_name: kafka
    mem_limit: 1g
    cpus: 1.0
    ports:
      - "9092:9092" # host access
      - "29092:29092" # inter-container access
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_HEAP_OPTS: "-Xms256M -Xmx512M"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - data-net
    healthcheck:
      test:
        [
          "CMD",
          "kafka-topics",
          "--bootstrap-server",
          "localhost:9092",
          "--list",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["ui"]
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - data-net

  # Static server for the BR1 tourist map (serving/ on the host).
  tour-map:
    image: nginx:1.27-alpine
    container_name: tour-map
    ports: ["8090:80"]
    volumes:
      - ./serving:/usr/share/nginx/html:ro
    networks: [data-net]

  # ------------------------------------------------------------------
  # Spark
  # ------------------------------------------------------------------
  spark-master:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: co5173-spark-demo:local
    container_name: spark-master
    profiles: ["full"]
    mem_limit: 512m
    cpus: 0.5
    user: "0:0"
    environment:
      - SPARK_MODE=master
      - SPARK_DAEMON_MEMORY=256m
    configs:
      - source: spark-metrics-properties
        target: /opt/bitnami/spark/conf/metrics.properties
    ports:
      - "7077:7077" # Spark master port
      - "8082:8080" # Spark master Web UI
      # Prometheus-format metrics: http://localhost:8082/metrics/master/prometheus/
    networks:
      - data-net

  spark-worker:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: co5173-spark-demo:local
    container_name: spark-worker
    profiles: ["full"]
    mem_limit: 2500m
    # BR5_WORKER_CORES: the BR5 benchmark's start-up sizes (docs/plan/br5/plan-benchmark.md); default 2.
    cpus: ${BR5_WORKER_CORES:-2}
    user: "0:0"
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=${BR5_WORKER_CORES:-2}
      - SPARK_DAEMON_MEMORY=256m
      - PYTHONPATH=/opt/jobs/common
    configs:
      - source: spark-metrics-properties
        target: /opt/bitnami/spark/conf/metrics.properties
    volumes:
      - ./jobs:/opt/jobs
      - ./data:/opt/data
      - ./logs:/opt/logs
    ports:
      - "8083:8081" # Spark worker Web UI / metrics: /metrics/prometheus/
    networks:
      - data-net

  # Submit and run Spark jobs against the standalone master in the full demo.
  spark-local:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: co5173-spark-demo:local
    container_name: spark-local
    mem_limit: 6g
    cpus: 2.0
    user: "0:0"
    entrypoint: ["tail", "-f", "/dev/null"]
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - CLICKHOUSE_HOST=clickhouse
      - PYTHONPATH=/opt/jobs/common
      - DEMO_LOG_DIR=/opt/logs/demo
    volumes:
      - ./jobs:/opt/jobs
      - ./ingestion:/opt/ingestion
      - ./scripts:/opt/scripts
      - ./data:/opt/data
      - ./logs:/opt/logs
      - ./requirements.txt:/opt/requirements.txt
    networks:
      - data-net

  # BR5 web app (Streamlit). Same image as spark-local, so it can launch
  # spark-submit itself; the driver runs here, hence the fixed hostname.
  br5-app:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: co5173-spark-demo:local
    container_name: br5-app
    hostname: br5-app
    profiles: ["br5", "br6"]
    mem_limit: 2g
    cpus: 1.0
    user: "0:0"
    depends_on:
      - clickhouse
    entrypoint:
      - python3
      - -m
      - streamlit
      - run
      - /opt/apps/br5/app.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --client.toolbarMode=minimal
    environment:
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_DRIVER_HOST=br5-app
      - CLICKHOUSE_HOST=clickhouse
      - PYTHONPATH=/opt/jobs/common:/opt/jobs/br5_promotion:/opt/jobs/br6_route
      - BR5_LOG_DIR=/opt/logs/br5
      - BR6_LOG_DIR=/opt/logs/br6
    volumes:
      - ./apps:/opt/apps
      - ./jobs:/opt/jobs
      - ./data:/opt/data
      - ./logs:/opt/logs
      - ./tests:/opt/tests:ro
    ports:
      - "8501:8501"
      - "4040:4040"   # live Spark page of the run in progress
    networks:
      - data-net

  # BR5 monitoring (docs/plan/br5/plan-monitoring.md).
  # Spark history server: keeps each BR5 run's Spark page after the run ends.
  spark-history:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: co5173-spark-demo:local
    container_name: spark-history
    profiles: ["br5", "br6"]
    mem_limit: 512m
    cpus: 0.5
    user: "0:0"
    entrypoint:
      - bash
      - -c
      - mkdir -p /opt/logs/spark-events && exec /opt/bitnami/spark/bin/spark-class org.apache.spark.deploy.history.HistoryServer
    environment:
      - SPARK_DAEMON_MEMORY=256m
      - >-
        SPARK_HISTORY_OPTS=-Dspark.history.fs.logDirectory=file:/opt/logs/spark-events
        -Dspark.history.fs.update.interval=5s
        -Dspark.history.fs.cleaner.enabled=true
        -Dspark.history.fs.cleaner.maxAge=30d
    volumes:
      - ./logs:/opt/logs
    ports:
      - "18080:18080"
    networks:
      - data-net

  # CPU and memory per container for Prometheus (cAdvisor can't map containers
  # on this Docker host). Reads the Docker socket; read-only use.
  docker-stats:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: co5173-spark-demo:local
    container_name: docker-stats
    profiles: ["br5", "br6"]
    mem_limit: 128m
    cpus: 0.25
    user: "0:0"
    entrypoint: ["python3", "-u", "/opt/docker-stats/exporter.py"]
    volumes:
      - ./docker/docker-stats:/opt/docker-stats:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - data-net

  # ------------------------------------------------------------------
  # Prometheus
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: prometheus
    profiles: ["monitoring"]
    mem_limit: 256m
    cpus: 0.5
    configs:
      - source: prometheus-yml
        target: /etc/prometheus/prometheus.yml
    # Image defaults plus a longer retention (BR5 run history, plan B6).
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=90d
    volumes:
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - data-net

  # ------------------------------------------------------------------
  # Grafana
  # ------------------------------------------------------------------
  grafana:
    image: grafana/grafana:13.2
    container_name: grafana
    profiles: ["monitoring"]
    mem_limit: 1g
    cpus: 1.0
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    configs:
      - source: grafana-datasource-yml
        target: /etc/grafana/provisioning/datasources/prometheus.yml
      - source: grafana-dashboard-provider-yml
        target: /etc/grafana/provisioning/dashboards/co5173.yml
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/dashboards-br5:/var/lib/grafana/dashboards-br5:ro
      - ./grafana/dashboards-br6:/var/lib/grafana/dashboards-br6:ro
    ports:
      - "3000:3000"
    networks:
      - data-net
