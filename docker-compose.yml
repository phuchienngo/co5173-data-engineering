  # ════════════════════════════════════════════════════════════════════════
  #  Kafka → Spark (Batch & Structured Streaming) → ClickHouse → Grafana/Streamlit
  #
  #
  # ════════════════════════════════════════════════════════════════════════

  name: tourism-data-pipeline

  networks:
    data-net:
      driver: bridge

  volumes:
    clickhouse-data:
    clickhouse-logs:
    kafka-data:
    prometheus-data:
    grafana-data:

  x-spark-common: &spark-common
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: data-pipeline/spark:3.5.1
    networks: [data-net]
    volumes:
      - ./jobs:/opt/jobs
      - ./data:/opt/data
      - ./sql:/opt/sql
    environment: &spark-env
      PYTHONPATH: /opt/jobs
      PYTHONUNBUFFERED: "1"
      KAFKA_BOOTSTRAP: kafka:29092
      KAFKA_TOPIC_FLIGHTS: flight_events
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_HTTP_PORT: "8123"
      CLICKHOUSE_NATIVE_PORT: "9000"
      CLICKHOUSE_DB: tourism
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: clickhouse
      DATA_ROOT: /opt/data
      SPARK_MASTER_URL: spark://spark-master:7077

  services:

    # ══════════════════════════════════════════════════════════════════
    # ══════════════════════════════════════════════════════════════════
    kafka:
      image: confluentinc/cp-kafka:7.6.1
      container_name: dp-kafka
      ports:
        - "9092:9092"
        - "29092:29092"
      environment:
        KAFKA_NODE_ID: 1
        KAFKA_PROCESS_ROLES: broker,controller
        KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
        KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
        KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
        KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
        KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
        KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
        KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
        KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
        KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
        KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
        KAFKA_LOG_RETENTION_HOURS: 168
        CLUSTER_ID: UGFBQWZsaWdodHMwMDAwMQ
      volumes:
        - kafka-data:/var/lib/kafka/data
      networks: [data-net]
      healthcheck:
        test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:29092", "--list"]
        interval: 10s
        timeout: 10s
        retries: 10
        start_period: 30s

    kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: dp-kafka-ui
      depends_on:
        kafka: { condition: service_healthy }
      ports:
        - "8080:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
        DYNAMIC_CONFIG_ENABLED: "true"
      networks: [data-net]

    # ══════════════════════════════════════════════════════════════════
    # ══════════════════════════════════════════════════════════════════
    clickhouse:
      image: clickhouse/clickhouse-server:24.8
      container_name: dp-clickhouse
      ulimits:
        nofile: { soft: 262144, hard: 262144 }
      ports:
        - "8123:8123"   # HTTP  — clickhouse-connect, curl
        - "9000:9000"   # Native — clickhouse-client, Grafana
        - "9363:9363"   # Prometheus metrics
      environment:
        CLICKHOUSE_DB: tourism
        CLICKHOUSE_USER: default
        CLICKHOUSE_PASSWORD: clickhouse
        CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      volumes:
        - clickhouse-data:/var/lib/clickhouse
        - clickhouse-logs:/var/log/clickhouse-server
        - ./conf/clickhouse/config.d:/etc/clickhouse-server/config.d
        - ./conf/clickhouse/users.d:/etc/clickhouse-server/users.d
        - ./sql:/opt/sql
      networks: [data-net]
      healthcheck:
        test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s

    # ══════════════════════════════════════════════════════════════════
    # ══════════════════════════════════════════════════════════════════
    spark-master:
      <<: *spark-common
      container_name: dp-spark-master
      command: ["/opt/spark-entrypoint.sh", "master"]
      ports:
        - "7077:7077"   # submit
        - "8082:8080"   # Master Web UI  → http://localhost:8082
      healthcheck:
        test: ["CMD", "curl", "-fsS", "http://localhost:8080"]
        interval: 10s
        timeout: 5s
        retries: 10
        start_period: 20s

    spark-worker:
      <<: *spark-common
      container_name: dp-spark-worker
      depends_on:
        spark-master: { condition: service_healthy }
      command: ["/opt/spark-entrypoint.sh", "worker"]
      environment:
        <<: *spark-env
        SPARK_WORKER_CORES: "3"
        SPARK_WORKER_MEMORY: "3g"
      ports:
        - "8083:8081"   # Worker Web UI → http://localhost:8083

    spark-client:
      <<: *spark-common
      container_name: dp-spark-client
      depends_on:
        spark-master: { condition: service_healthy }
        clickhouse:   { condition: service_healthy }
        kafka:        { condition: service_healthy }
      command: ["tail", "-f", "/dev/null"]
      ports:
        - "4040:4040"

    # ══════════════════════════════════════════════════════════════════
    # ══════════════════════════════════════════════════════════════════
    grafana:
      image: grafana/grafana:11.2.0
      container_name: dp-grafana
      depends_on:
        clickhouse: { condition: service_healthy }
      ports:
        - "3000:3000"
      environment:
        GF_SECURITY_ADMIN_USER: admin
        GF_SECURITY_ADMIN_PASSWORD: admin
        GF_AUTH_ANONYMOUS_ENABLED: "false"
        GF_USERS_DEFAULT_THEME: light
        GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
        CH_PASSWORD: clickhouse
      volumes:
        - grafana-data:/var/lib/grafana
        - ./conf/grafana/provisioning:/etc/grafana/provisioning:ro
        - ./conf/grafana/dashboards:/var/lib/grafana/dashboards:ro
      networks: [data-net]

    webapp:
      build:
        context: .
        dockerfile: docker/app/Dockerfile
      image: data-pipeline/webapp:1.0
      container_name: dp-webapp
      depends_on:
        clickhouse: { condition: service_healthy }
      ports:
        - "8501:8501"
      environment:
        CLICKHOUSE_HOST: clickhouse
        CLICKHOUSE_HTTP_PORT: "8123"
        CLICKHOUSE_DB: tourism
        CLICKHOUSE_USER: default
        CLICKHOUSE_PASSWORD: clickhouse
      volumes:
        - ./app:/app
      networks: [data-net]

    # ══════════════════════════════════════════════════════════════════
    # ══════════════════════════════════════════════════════════════════
    prometheus:
      image: prom/prometheus:v2.54.1
      container_name: dp-prometheus
      volumes:
        - ./conf/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
        - prometheus-data:/prometheus
      ports:
        - "9090:9090"
      networks: [data-net]
